
server.port=8080
spring.application.name=ecologix

# Veritabani ayarlari
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecologix_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ACO algoritmasi
aco.ant-count=100
aco.iterations=200
aco.alpha=1.0
aco.beta=2.0
aco.evaporation=0.5
aco.q=500.0

# Genetik Algoritma (GA)
ga.population-size=100
ga.generations=200
ga.mutation-rate=0.1

# SGO algoritmasi
sgo.player-size=100
sgo.max-games=200

# Emisyon ve optimizasyon katsayilari
eco.emission.base-rate=0.15
eco.emission.weight-factor=0.005
eco.optimization.carbon-weight=5.0

# EcoLogix karar katsayilari
# Toplamlari 1.0 olmalidir
ecologix.weight.distance=0.7
ecologix.weight.carbon=0.3
